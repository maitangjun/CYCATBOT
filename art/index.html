    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=Share+Tech+Mono&display=swap');
        body { background: #ffffff; color: #000000; font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif; }
        .font-mech { font-family: 'Share Tech Mono', monospace; font-weight: 800; letter-spacing: .05em; }
        .grid-bg { background-image: radial-gradient(#e5e7eb 1px, transparent 1px); background-size: 24px 24px; }
        [x-cloak] { display: none !important; }
        .responsive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        @media (max-width: 768px) {
            .responsive-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1rem;
            }
        }
        .robots-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(2, 1fr);
            max-width: 960px;
            margin: 0 auto;
        }
        @media (min-width: 1024px) {
            .robots-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        .robots-grid img {
            object-position: 50% 25% !important;
        }
        .responsive-grid img {
            object-position: center 20% !important;
        }
        .art-grid {
            display: grid;
            gap: 1.5rem;
            grid-template-columns: repeat(2, 1fr);
            max-width: 1200px;
            margin: 0 auto;
        }
        @media (min-width: 768px) {
            .art-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (min-width: 1024px) {
            .art-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        /* 艺术项目封面优化：露出全脸 */
        .art-grid img {
            object-position: center 15% !important;
        }
.robots-title {
            word-break: break-word;
            overflow: visible;
            white-space: normal;
            line-height: 1.25;
        }
        
    </style>
</head>
